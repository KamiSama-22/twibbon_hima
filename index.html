<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Funcamp 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-blue-600 font-sans text-gray-800">

    <div class="flex-shrink-0 flex items-center bg-[#E5E7EB] px-4 py-3 shadow-sm border border-gray-100 mb-8">
        <!-- Bagian Kiri: Logo Utama & Judul -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-200 rounded-full flex-shrink-0 overflow-hidden">
                <img src="asset/Main Logo.png" alt="Avatar" class="w-full h-full object-cover">
            </div>
            <div>
                <h2 class="text-2xl font-bold text-blue-600">TwiMATIV</h2>
            </div>
        </div>

        <a href="https://www.instagram.com/himativ.harkatnegeri/" target="_blank" class="ml-auto flex items-center gap-1.5 hover:opacity-80 transition">
            <span class="text-xs font-semibold text-gray-600">Kunjungi &gt;</span>
            <img src="asset/instagram.png" alt="instagram" class="w-10 h-10 object-contain">
        </a>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-20 rounded-xl">
        <div class="px-5 py-5 mt-10 mb-10">

<!-- LANGKAH 1: PILIH FOTO & PREVIEW -->
            <div id="step-1" class="block mb-6">
                
                <!-- Tombol Ganti Foto -->
                <div id="container-ganti-foto" class="hidden justify-end mb-2">
                    <button id="btn-ganti-foto" class="flex items-center text-xs font-bold text-red-500 hover:text-red-600 bg-red-50 px-3 py-1.5 rounded-lg border border-red-100 transition">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Ganti Foto
                    </button>
                </div>

                <!-- Area Bingkai (Ukuran mengikuti rasio asli gambar twibbon) -->
                <div id="area-bingkai" class="relative w-full bg-gray-100 rounded-xl overflow-hidden border border-gray-200 mb-5 shadow-inner cursor-pointer">
                    
                    <!-- Kotak Viewport Khusus Area Putih di dalam Frame -->
                    <!-- (Jika posisi kotak putih di twibbon kamu sedikit bergeser, kamu bisa sesuaikan persentase top, left, width, height di sini) -->
                    <div id="photo-viewport" class="absolute top-[25%] left-[9%] w-[82%] h-[52%] overflow-hidden hidden">
                        <div id="photo-wrapper" class="w-full h-full relative flex items-center justify-center">
                            <img id="user-photo-img" src="" alt="Foto" class="max-w-none select-none cursor-grab active:cursor-grabbing absolute" style="transform: translate(0px, 0px) scale(1);">
                        </div>
                    </div>

                    <!-- Bingkai Twibbon (Selalu di atas & ukurannya natural) -->
                    <img id="frame-preview-img" src="asset/twibon.png" alt="Preview Bingkai" class="w-full h-auto block pointer-events-none relative z-10">
                </div>
            </div>

            <div>
                <div class="space-y-3">
                    
                    <!-- Slider Zoom -->
                    <div id="zoom-container" class="hidden px-2 mb-4">
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                            <span>- Perkecil</span>
                            <span>Geser untuk Zoom</span>
                            <span>Perbesar +</span>
                        </div>
                        <input type="range" id="zoom-slider" min="0.2" max="3" step="0.01" value="1" class="w-full cursor-pointer">
                    </div>

                    <input type="file" id="upload-foto" accept="image/*" class="hidden">
                    <label for="upload-foto" class="flex items-center justify-center w-full bg-blue-600 text-white text-center py-3.5 rounded-full font-bold cursor-pointer hover:bg-blue-700 active:bg-blue-800 transition shadow-lg shadow-blue-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Pilih Foto
                    </label>

                    <!-- Tombol Unduh Langsung -->
                    <button id="btn-unduh-langsung" disabled class="w-full bg-gray-300 text-gray-500 py-3.5 rounded-full font-bold cursor-not-allowed transition shadow-lg flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Unduh Foto
                    </button>
                </div>
            </div>

            <!-- Langkah 2 (Bagian Caption tetap saya biarkan agar kode asli Anda tidak ada yang hilang) -->
            <div id="step-2" class="hidden mt-6">
                <h3 class="font-bold text-lg mb-3">Selesai! Unduh Twibbon-mu</h3>
                <!-- Tombol Aksi -->
                <div class="flex gap-2 mb-6">
                    <button id="btn-unduh" class="flex-1 bg-blue-600 text-white py-3 rounded-full font-bold hover:bg-blue-700 transition flex items-center justify-center">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Unduh Foto
                    </button>
                    <button id="btn-kembali" class="w-12 h-12 flex items-center justify-center bg-gray-100 text-gray-700 rounded-full font-bold hover:bg-gray-200 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                </div>
                <!-- Area Caption -->
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 relative">
                    <p class="text-xs font-bold text-blue-600 mb-2 uppercase tracking-wide">Caption Postingan</p>
                    <p id="caption-teks" class="text-sm text-gray-700 leading-relaxed mb-4">
                        Halo semuanya! Saya siap bergabung di Funcamp 2026. Mari kita ciptakan momen seru bersama dan jalin pertemanan baru! 🏕️✨<br><br>#Funcamp2026 #AcaraSeru #SiapBerangkat
                    </p>
                    <button id="btn-salin" class="w-full bg-white border border-gray-300 text-gray-700 py-2.5 rounded-lg text-sm font-bold hover:bg-gray-50 transition flex items-center justify-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Salin Caption
                    </button>
                </div>
            </div>

        </div>
    </div>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
