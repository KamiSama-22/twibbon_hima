<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Funcamp 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-900 font-sans text-white min-h-screen">

    <div class="fixed inset-0 z-0 bg-gradient-to-b from-blue-800 via-blue-600 to-blue-500 overflow-hidden pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[850px] h-[850px] rounded-full border-[60px] border-white/5"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] rounded-full border-[60px] border-white/5"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[250px] h-[250px] rounded-full border-[60px] border-white/5"></div>
    </div>

    <div class="fixed top-0 inset-x-0 z-50 h-20 bg-white/10 backdrop-blur-xl border-b border-white/20 flex items-center justify-between px-6 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full flex-shrink-0 overflow-hidden bg-white/20 p-1">
                <img src="asset/Himativ Putih.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <h2 class="text-xl font-bold text-white tracking-wide">Twimativ</h2>
        </div>
        <a href="https://www.instagram.com/himativ.harkatnegeri/" target="_blank" class="hover:opacity-75 transition flex items-center ">
            <h2 class="text-sm font-bold text-white tracking-wide">Kunjungi</h2>
            <img src="asset/instagram.png" alt="IG" class="w-11 h-11 object-contain">
        </a>
    </div>

    <div class="relative z-20 flex flex-col min-h-screen pt-28">
        
        <div class="w-full max-w-md mx-auto px-5 flex-1 flex flex-col">
            
            <div id="step-1" class="flex flex-col flex-1">
                
                <div id="container-ganti-foto" class="hidden justify-end mb-3">
                    <button id="btn-ganti-foto" class="flex items-center text-xs font-bold text-white hover:text-blue-200 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 transition shadow-sm">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 mr-1.5"></i>
                        Ganti Foto
                    </button>
                </div>

                <div id="area-bingkai" class="relative w-full bg-white/10 backdrop-blur-md border border-white/30 rounded-3xl overflow-hidden mb-6 shadow-xl cursor-pointer">
                    <div id="photo-viewport" class="absolute top-[10%] left-[10%] w-[80%] h-[80%] overflow-hidden hidden">
                        <div id="photo-wrapper" class="w-full h-full relative flex items-center justify-center">
                            <img id="user-photo-img" src="" alt="Foto" class="max-w-none select-none cursor-grab active:cursor-grabbing absolute" style="transform: translate(0px, 0px) scale(1);">
                        </div>
                    </div>
                    <img id="frame-preview-img" src="asset/twibon.png" alt="Twibbon" class="w-full h-auto block pointer-events-none relative z-10">
                </div>

                <div id="zoom-container" class="hidden px-2 mb-6 w-full">
                    <div class="flex justify-between text-xs font-semibold text-blue-100 mb-2">
                        <span>- Perkecil</span>
                        <span>Geser untuk Zoom</span>
                        <span>Perbesar +</span>
                    </div>
                    <input type="range" id="zoom-slider" min="0.2" max="3" step="0.01" value="1" class="w-full cursor-pointer accent-white">
                </div>

                <div class="mt-auto space-y-3 pb-8">
                    <input type="file" id="upload-foto" accept="image/*" class="hidden">
                    <label for="upload-foto" class="bg-white/20 backdrop-blur-md border border-white/30 text-white font-semibold rounded-2xl hover:bg-white/30 transition py-3.5 flex items-center justify-center cursor-pointer shadow-lg">
                        <i data-lucide="image" class="w-5 h-5 mr-2"></i>
                        Pilih Foto
                    </label>
                    <button id="btn-unduh-langsung" disabled class="w-full bg-white/10 backdrop-blur-md border border-white/20 text-white/50 font-semibold rounded-2xl transition py-3.5 flex items-center justify-center cursor-not-allowed enabled:bg-blue-500 enabled:text-white enabled:border-blue-400 enabled:hover:bg-blue-400 enabled:cursor-pointer shadow-lg enabled:shadow-[0_10px_20px_rgba(0,0,0,0.2)]">
                        <i data-lucide="download" class="w-5 h-5 mr-2"></i>
                        Unduh Foto
                    </button>
                </div>
            </div>

            <div id="step-2" class="hidden mt-4 animate-[fadeIn_0.5s_ease-out]">
                <h3 class="font-bold text-xl mb-4 text-center text-white">Selesai!</h3>
                
                <div class="flex gap-3 mb-6">
                    <button id="btn-unduh" class="flex-1 bg-white text-blue-600 py-3.5 rounded-2xl font-bold hover:bg-blue-50 transition shadow-lg flex items-center justify-center">
                        <i data-lucide="download" class="w-5 h-5 mr-2"></i>
                        Unduh Twibbon
                    </button>
                    <button id="btn-kembali" class="w-14 flex items-center justify-center bg-white/20 backdrop-blur-md border border-white/30 text-white rounded-2xl font-bold hover:bg-white/30 transition shadow-lg">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div id="caption-container" class="hidden flex-col gap-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-5 shadow-lg mt-2 mb-10">
                <div>
                    <label class="block text-sm font-semibold text-blue-100 mb-2">Nama Kamu:</label>
                    <input type="text" id="input-nama" placeholder="Ketik nama kamu di sini..." class="w-full px-4 py-3 rounded-xl border border-white/20 bg-white/10 backdrop-blur-sm text-white placeholder-blue-200 focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-blue-100 mb-2">Caption Khusus:</label>
                    <textarea id="box-caption" rows="10" readonly class="w-full p-4 rounded-xl border border-white/20 bg-black/20 text-blue-50 text-xs resize-none focus:outline-none leading-relaxed">Petualangan baru telah menanti!
Di alam bebas kita belajar tentang kebersamaan, kemandirian, dan solidaritas.

Halo semuanya! Saya [Nama Kamu] dari D4 Teknik Informatika Universitas Harkat Negeri, menyatakan bahwa saya SIAP untuk ikut serta dan memeriahkan acara FUNCAMP! 

Mari kita sukseskan acara ini, jaga kelestarian alam, dan buat cerita seru bersama! 

Are you ready for the fun? 
Because I AM READY FOR FUNCAMP! 🔥🔥

📸 Instagram: @himativ.harkatnegeri
▶️ YouTube: HIMATIV UHN

#IReadyForFuncamp #Funcamp2026</textarea>
                </div>
                <button id="btn-salin" class="w-full bg-blue-500 hover:bg-blue-400 text-white py-3.5 rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center border border-blue-400">
                    <i data-lucide="copy" class="w-5 h-5 mr-2"></i>
                    Salin Caption
                </button>
            </div>

        </div>

        <div class="w-full mt-auto bg-slate-950/90 backdrop-blur-md border-t border-white/10 flex flex-col items-center justify-center py-5">
            <p class="text-[10px] font-medium text-slate-400 tracking-widest uppercase">
                <span class="text-blue-400">HIMATIV</span> Universitas Harkat Negeri 2026
            </p>
            <p class="text-xs font-bold text-white mt-0.5">
                Di buat Oleh <span class="text-blue-400">Kreatif</span> Funcamp 2026
            </p>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
